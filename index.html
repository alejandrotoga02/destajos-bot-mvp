<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control de Destajos - Obra</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

  <!-- Barra de Pestañas -->
  <div class="tabs">
    <button class="tab-btn active" onclick="cambiarTab('reportar', this)">📝 Reportar</button>
    <button class="tab-btn" onclick="cambiarTab('historial', this)">📊 Historial (<span id="count-reportes">0</span>)</button>
    <button class="tab-btn" onclick="cambiarTab('catalogos', this)">⚙️ Catálogos</button>
  </div>

  <div class="container">

    <!-- MÓDULO 1: CAPTURA -->
    <div id="view-reportar" class="view active">
      <div class="card">
        <h3>🧱 Registro de Avance a Destajo</h3>
        
        <label>Obra Asignada</label>
        <select id="sel-obra"></select>

        <label>Albañil / Destajista</label>
        <select id="sel-albanil"></select>

        <label>Concepto de Obra</label>
        <select id="sel-concepto" onchange="calcularTotal()"></select>

        <label>Cantidad Avanzada (<span id="lbl-unidad">m²</span>)</label>
        <input type="number" id="inp-cantidad" placeholder="Ej. 24.5" step="0.1" min="0.1" oninput="calcularTotal()">

        <div class="total-box">
          <span>Subtotal estimado:</span>
          <strong>$<span id="lbl-total">0.00</span></strong>
        </div>
      </div>
    </div>

    <!-- MÓDULO 2: HISTORIAL Y CORTES -->
    <div id="view-historial" class="view">
      <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <div style="font-size: 11px; color: var(--hint); text-transform: uppercase; font-weight: 700;">Acumulado Global</div>
          <div style="font-size: 22px; font-weight: bold; color: var(--success);">$<span id="gran-total">0.00</span></div>
        </div>
        <button class="btn btn-danger" onclick="limpiarHistorial()">Vaciar Historial</button>
      </div>

      <div class="card">
        <h3>📋 Historial de Avances</h3>
        <div id="lista-reportes"></div>
      </div>
    </div>

    <!-- MÓDULO 3: CONFIGURACIÓN DE CATÁLOGOS -->
    <div id="view-catalogos" class="view">
      
      <!-- Obras -->
      <div class="card">
        <h3>🏗 Obras Activas</h3>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="new-obra" placeholder="Nombre de nueva obra..." style="margin-bottom: 0;">
          <button class="btn" style="width: auto;" onclick="agregarObra()">Agregar</button>
        </div>
        <div id="list-obras" style="margin-top: 12px;"></div>
      </div>

      <!-- Albañiles -->
      <div class="card">
        <h3>👷 Albañiles Destajistas</h3>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="new-albanil" placeholder="Nombre del albañil..." style="margin-bottom: 0;">
          <button class="btn" style="width: auto;" onclick="agregarAlbanil()">Agregar</button>
        </div>
        <div id="list-albaniles" style="margin-top: 12px;"></div>
      </div>

      <!-- Conceptos -->
      <div class="card">
        <h3>📐 Conceptos y Precios Unitarios</h3>
        <input type="text" id="new-concepto-nombre" placeholder="Concepto (ej. Colocación de loseta)">
        <div class="row-2">
          <input type="text" id="new-concepto-unidad" placeholder="Unidad (ej. m², pza, ml)">
          <input type="number" id="new-concepto-precio" placeholder="Precio ($)">
        </div>
        <button class="btn" onclick="agregarConcepto()">Agregar Concepto</button>
        <div id="list-conceptos" style="margin-top: 12px;"></div>
      </div>

    </div>

  </div>

  <!-- Controlador principal -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
